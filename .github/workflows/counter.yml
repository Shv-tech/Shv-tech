name: count the seconds

on:
  schedule:
    - cron: "17 0 * * *"   # daily, 05:47 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/count_seconds.py
      - name: commit
        run: |
          git config user.name "kingdom-of-science-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "⏱️ still counting"
          git push
